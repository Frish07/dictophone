name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/cmake -A x64
      - name: Build
        shell: pwsh
        run: |
          $buildOutput = & cmake --build build/cmake --config Release 2>&1
          $buildExit = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Output $_ }
          if ($buildExit) {
            $buildOutput | Where-Object { $_ -match '(?i)error|fatal' } | Select-Object -First 15 | ForEach-Object {
              $detail = $_.ToString().Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Windows compilation::$detail"
            }
            exit $buildExit
          }
      - name: Prepare encoder and portable app
        shell: pwsh
        run: |
          ./scripts/setup-ffmpeg.ps1
          Copy-Item build/cmake/Release/Dictophone.exe app/Dictophone.exe -Force
      - name: Test with all codecs
        run: ./build/cmake/Release/AudioTests.exe
      - name: Package
        shell: pwsh
        run: |
          $files = @('app/Dictophone.exe','app/ffmpeg.exe','app/ffmpeg-license.txt','app/ffmpeg-build.txt','README.md','LICENSE','CHANGELOG.md')
          Compress-Archive -Path $files -DestinationPath build/Dictophone-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dictophone-Windows-x64
          path: build/Dictophone-Windows-x64.zip
